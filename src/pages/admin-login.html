<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login — PCOS Care Hub</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <style>
        body {
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .super-admin-card {
            background: white;
            padding: 3rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-icon-wrap {
            width: 80px;
            height: 80px;
            background: #eef2ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .admin-icon {
            font-size: 2.5rem;
        }

        h1 {
            color: #1e293b;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .login-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #0f172a;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .back-link {
            margin-top: 2rem;
            display: block;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #1e293b;
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="super-admin-card">
        <div class="admin-icon-wrap">
            <span class="admin-icon">🛡️</span>
        </div>
        <h1>PCOS Care Hub</h1>
        <p class="subtitle">Super Administrator Authentication</p>

        <form id="adminLoginForm" onsubmit="handleSuperAdminLogin(event)">
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="login-btn">
                <span>Access Management</span>
                <span>➜</span>
            </button>
        </form>

        <a href="index.html" class="back-link">← Return to Main Site</a>
        
        <div class="footer-note">Secure Administrative Layer</div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script>
        async function handleSuperAdminLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = '<span>Verifying...</span>';
            btn.disabled = true;

            try {
                const response = await API.call('components/login_handler.php', {
                    identity: username,
                    password: password,
                    role: 'admin'
                });

                if (response.status === 'success') {
                    Auth.login(response.user.role, response.user.name);
                    Toast.success('Identity Verified. Redirecting...');
                    
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    Toast.error(response.message || 'Invalid Super Admin credentials');
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }
            } catch (error) {
                Toast.error('System error. Access denied.');
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
