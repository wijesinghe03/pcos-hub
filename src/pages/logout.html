<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed Out — PCOS Care Hub</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <style>
        :root {
            --purple-primary: #6d28d9;
            --purple-ghost: #f5f3ff;
            --text-dark: #1e1b4b;
            --text-mid: #475569;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            font-family: 'Inter', sans-serif;
        }

        .logout-container {
            background: white;
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(109, 40, 217, 0.1);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logout-icon {
            width: 80px;
            height: 80px;
            background: var(--purple-ghost);
            color: var(--purple-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
            position: relative;
        }

        .logout-icon::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 2px dashed var(--purple-primary);
            border-radius: 50%;
            opacity: 0.2;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            color: var(--text-dark);
            margin: 0 0 12px;
            font-weight: 800;
            font-size: 1.75rem;
        }

        p {
            color: var(--text-mid);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-relogin {
            display: inline-block;
            background: var(--purple-primary);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(109, 40, 217, 0.3);
        }

        .btn-relogin:hover {
            background: #5b21b6;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(109, 40, 217, 0.4);
        }

        .timer-text {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 24px;
        }

        .brand-footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: var(--text-mid);
            font-weight: 700;
        }

        .brand-footer span {
            color: var(--purple-primary);
        }
    </style>
</head>

<body>
    <div class="logout-container">
        <div class="logout-icon">🚪</div>
        <h2>Successfully Signed Out</h2>
        <p>Thank you for using PCOS Care Hub. Your session has been securely ended to protect your data.</p>

        <a href="index.html" class="btn-relogin">Back to Login</a>

        <div class="timer-text">
            Redirecting to homepage in <span id="countdown">10</span> seconds...
        </div>

        <div class="brand-footer">
            <span>PCOS</span> Care Hub
        </div>
    </div>

    <script>
        let seconds = 10;
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>

</html>
