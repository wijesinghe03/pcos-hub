<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../../assets/js/theme-init.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Results — PCOS Care Hub</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">

</head>

<body>
    <div id="page-loader" class="page-loader">
        <div class="loader-ring"></div>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>
    <div id="sidebar-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

    <div class="dashboard-layout">
        <!-- SIDEBAR -->
        <div id="sidebar-placeholder" data-active="lab-results"></div>

        <!-- MAIN -->
        <main class="dash-main">
            <div class="dash-topbar">
                <div class="dash-page-title">
                    <h2>Lab Results</h2>
                    <p id="dateDisplay">Loading...</p>
                </div>
                <div class="topbar-actions">
                    <button class="topbar-icon-btn" title="Notifications">🔔<span class="notif-dot"></span></button>
                </div>
            </div>

            <!-- Filter Panel -->
            <div class="dash-panel reveal">
                <div class="panel-header">
                    <div class="panel-title"><i>🔍</i> Filter Results</div>
                </div>
                <div
                    style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px">
                    <div>
                        <label
                            style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Patient
                            ID or Name</label>
                        <input type="text" id="labFilterPatient" class="form-control" placeholder="Search patient..."
                            onkeyup="filterLabResults()"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                    </div>
                    <div>
                        <label
                            style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Test
                            Type</label>
                        <select id="labFilterTest" class="form-control" onchange="filterLabResults()"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                            <option value="">All Tests</option>
                            <option value="blood">Blood Test</option>
                            <option value="hormone">Hormone Panel</option>
                            <option value="ultrasound">Ultrasound</option>
                            <option value="thyroid">Thyroid Panel</option>
                            <option value="imaging">Imaging</option>
                        </select>
                    </div>
                    <div>
                        <label
                            style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Status</label>
                        <select id="labFilterStatus" class="form-control" onchange="filterLabResults()"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                            <option value="">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                            <option value="reviewed">Reviewed</option>
                            <option value="sent">Sent to Patient</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="filterLabResults()" style="width:100%">Filter Results</button>
            </div>

            <!-- Lab Results Table -->
            <div class="dash-panel reveal" style="margin-top:20px">
                <div class="panel-header">
                    <div class="panel-title"><i>🔬</i> Lab Results</div>
                    <a class="panel-action" href="#" onclick="openUploadModal()">Upload New →</a>
                </div>
                <div style="overflow-x:auto">
                    <table class="dash-table">
                        <thead>
                            <tr style="background:#f9fafb">
                                <th style="padding:12px;text-align:left">Patient Details</th>
                                <th style="padding:12px;text-align:left">Contact Info</th>
                                <th style="padding:12px;text-align:left">Test Name</th>
                                <th style="padding:12px;text-align:left">Request Date</th>
                                <th style="padding:12px;text-align:left">Status</th>
                                <th style="padding:12px;text-align:center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="labResultsTableBody">
                            <tr><td colspan="6" style="text-align:center;padding:40px"><div class="loader-ring" style="margin:0 auto;transform:scale(0.6)"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Register New Lab Test -->
            <div class="dash-panel reveal" style="margin-top:20px" id="registrationPanel">
                <div class="panel-header">
                    <div class="panel-title"><i>📝</i> Register New Lab Test</div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px">
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Patient ID</label>
                        <input type="text" id="regPatientId" class="form-control" placeholder="e.g., P-0001"
                            onblur="fetchPatientDetails()"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                    </div>
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Patient Name</label>
                        <input type="text" id="regPatientName" class="form-control" placeholder="e.g., Amanda Perera"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                    </div>
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Patient Email</label>
                        <input type="email" id="regPatientEmail" class="form-control" placeholder="e.g., amanda@email.com"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px">
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Contact Number</label>
                        <input type="text" id="regPatientPhone" class="form-control" placeholder="e.g., +94 77 123 4567"
                            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                    </div>
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Test Type</label>
                        <select id="regTestType" class="form-control" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                            <option>Blood Test</option>
                            <option>Hormone Panel</option>
                            <option>Ultrasound</option>
                            <option>Thyroid Panel</option>
                            <option>Imaging</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Specific Test Name</label>
                        <input type="text" id="regTestName" class="form-control" placeholder="e.g., Fasting Blood Sugar"
                                style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px">
                    </div>
                </div>
                <div style="display:flex;gap:12px">
                    <button id="btnRegister" class="btn btn-primary" style="flex:1" onclick="registerLabTest()">Register Request</button>
                    <button class="btn btn-outline" style="flex:1" onclick="clearRegForm()">Clear</button>
                </div>
            </div>

            <!-- Hidden File Input for Uploads -->
            <input type="file" id="labReportFileInput" style="display:none" accept=".pdf,.jpg,.png,.jpeg" onchange="handleFileSelection(event)">
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <!-- Modal for Search Patient (Account section) -->
    <div id="searchPatientModal" class="modal"
        style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center">
        <div class="modal-content"
            style="background:white;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);width:90%;max-width:600px;max-height:80vh;overflow-y:auto">
            <div class="modal-header"
                style="padding:20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center">
                <h3 style="margin:0;font-size:1.3rem;color:#1f2937">🔎 Search Patient</h3>
                <button onclick="closeSearchPatientModal()"
                    style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#6b7280">&times;</button>
            </div>

            <div class="modal-body" style="padding:20px">
                <div style="margin-bottom:20px">
                    <input type="text" id="modalPatientSearch" class="form-control"
                        placeholder="Search by Patient ID or NIC…"
                        style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem"
                        onkeyup="filterPatients()">
                </div>

                <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
                    <select id="patientStatusFilter" class="form-control"
                        style="flex:1;min-width:150px;padding:8px;border:1px solid #d1d5db;border-radius:8px"
                        onchange="filterPatients()">
                        <option value="">All Patients</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending Reports</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>

                <div id="patientResultsContainer" style="max-height:400px;overflow-y:auto">
                    <div id="noResultsMessage" style="text-align:center;padding:30px;color:#6b7280">
                        <p style="margin:0">Start typing to search for patients...</p>
                    </div>
                    <div id="patientResultsList" style="display:none"></div>
                </div>

                <div id="searchLoadingState" style="display:none;text-align:center;padding:20px">
                    <div class="loader-ring" style="transform:scale(0.5);margin:0 auto"></div>
                    <p style="color:#6b7280;margin-top:10px">Searching patients...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
        let currentLabResults = [];
        let selectedLabId = null;

        document.addEventListener('DOMContentLoaded', function () {
            // Sync dates
            const dateDisplay = document.getElementById('dateDisplay');
            if (dateDisplay) {
                const now = new Date();
                dateDisplay.textContent = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            fetchLabResults();
        });

        async function fetchPatientDetails() {
            let patientId = document.getElementById('regPatientId').value.trim();
            if (!patientId) return;

            // Extract numeric ID from P-XXXX format
            if (patientId.toUpperCase().startsWith('P-')) {
                patientId = patientId.substring(2);
            }

            try {
                // We'll use the existing search_patients.php but with an exact ID match
                const res = await fetch(`../php/search_patients.php?id=${patientId}&exact=true`);
                const response = await res.json();
                
                if (response.status === 'success' && response.data.length > 0) {
                    const patient = response.data[0];
                    document.getElementById('regPatientName').value = patient.name || '';
                    document.getElementById('regPatientEmail').value = patient.email || '';
                    document.getElementById('regPatientPhone').value = patient.phone || '';
                    Toast.success('Patient details found and filled.');
                }
            } catch (err) {
                console.error('Failed to fetch patient details:', err);
            }
        }

        async function fetchLabResults() {
            try {
                const res = await fetch('../php/get_hospital_lab_results.php');
                const response = await res.json();
                
                if (response.status === 'success') {
                    currentLabResults = response.data;
                    displayLabResults(currentLabResults);
                } else {
                    Toast.error(response.message);
                }
            } catch (err) {
                console.error(err);
                Toast.error('Failed to load lab results');
            }
        }

        function displayLabResults(results) {
            const tableBody = document.getElementById('labResultsTableBody');

            if (results.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#6b7280">No lab results found</td></tr>';
                return;
            }

            tableBody.innerHTML = results.map(result => `
                <tr style="border-bottom:1px solid #e5e7eb;transition:all 0.2s" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background=''">
                    <td style="padding:12px">
                        <div style="font-weight:700;color:#1f2937">${result.patient_name}</div>
                        <div style="font-size:0.85rem;color:var(--purple-primary);font-weight:600">ID: ${result.patient_id}</div>
                    </td>
                    <td style="padding:12px">
                        <div style="font-size:0.9rem;color:#374151">📧 ${result.email}</div>
                        <div style="font-size:0.85rem;color:#6b7280">📞 ${result.phone}</div>
                    </td>
                    <td style="padding:12px">
                        <div style="font-weight:600;color:#374151">${result.test_name}</div>
                        <div style="font-size:0.8rem;color:#6b7280">${result.test_type}</div>
                    </td>
                    <td style="padding:12px;color:#6b7280;font-size:0.9rem">${result.report_date}</td>
                    <td style="padding:12px">
                        <span style="padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;background:${
                            (result.status === 'sent' || result.status === 'completed' || result.status === 'uploaded') ? '#d1fae5;color:#065f46' : '#fef3c7;color:#92400e'
                        }">
                            ${(result.status === 'sent' || result.status === 'completed' || result.status === 'uploaded') ? '✅ Uploaded' : '⏳ Pending'}
                        </span>
                    </td>
                    <td style="padding:12px;text-align:center">
                        ${(!result.file_path && result.status !== 'uploaded' && result.status !== 'sent' && result.status !== 'completed') ? 
                            `<button class="btn btn-primary btn-sm" onclick="triggerFileUpload(${result.id})">📤 Upload Report</button>` :
                            `<button class="btn btn-sm" onclick="window.open('../../${result.file_path}', '_blank')" style="background-color:#6366f1;color:white;border:2px solid white;font-weight:600;padding:6px 12px;border-radius:8px">📄 View Report</button>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        function filterLabResults() {
            const patientFilter = document.getElementById('labFilterPatient').value.toLowerCase().trim();
            const testFilter = document.getElementById('labFilterTest').value;
            const statusFilter = document.getElementById('labFilterStatus').value;

            const filtered = currentLabResults.filter(result => {
                const matchesPatient = patientFilter === '' ||
                    result.patient_name.toLowerCase().includes(patientFilter) ||
                    result.patient_id.toLowerCase().includes(patientFilter);
                const matchesTest = testFilter === '' || result.test_type.toLowerCase().includes(testFilter.toLowerCase());
                const matchesStatus = statusFilter === '' || 
                    (statusFilter === 'sent' ? (result.status === 'sent' || result.status === 'completed' || result.status === 'uploaded') : (result.status !== 'sent' && result.status !== 'completed' && result.status !== 'uploaded'));
                return matchesPatient && matchesTest && matchesStatus;
            });

            displayLabResults(filtered);
        }

        async function registerLabTest() {
            const patientId = document.getElementById('regPatientId').value.trim();
            const patientName = document.getElementById('regPatientName').value.trim();
            const patientEmail = document.getElementById('regPatientEmail').value.trim();
            const patientPhone = document.getElementById('regPatientPhone').value.trim();
            const testType = document.getElementById('regTestType').value;
            const testName = document.getElementById('regTestName').value.trim();

            if (!patientId || !testName || !patientEmail) {
                Toast.warning('Please enter Patient ID, Email, and Test Name');
                return;
            }

            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.textContent = 'Registering...';

            try {
                const formData = new FormData();
                formData.append('patient_id', patientId);
                formData.append('patient_name', patientName);
                formData.append('patient_email', patientEmail);
                formData.append('patient_phone', patientPhone);
                formData.append('test_type', testType);
                formData.append('test_name', testName);

                const res = await fetch('../php/add_lab_request.php', {
                    method: 'POST',
                    body: formData
                });
                const response = await res.json();

                if (response.status === 'success') {
                    Toast.success(response.message);
                    clearRegForm();
                    fetchLabResults();
                } else {
                    Toast.error(response.message);
                }
            } catch (err) {
                console.error(err);
                Toast.error('An error occurred');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Register Request';
            }
        }

        function clearRegForm() {
            document.getElementById('regPatientId').value = '';
            document.getElementById('regPatientName').value = '';
            document.getElementById('regPatientEmail').value = '';
            document.getElementById('regPatientPhone').value = '';
            document.getElementById('regTestName').value = '';
        }

        function triggerFileUpload(labId) {
            console.log('Triggering upload for Lab ID:', labId);
            selectedLabId = labId;
            const fileInput = document.getElementById('labReportFileInput');
            if (fileInput) {
                fileInput.click();
            } else {
                console.error('File input element not found!');
                Toast.error('System error: Upload element missing');
            }
        }

        async function handleFileSelection(event) {
            const file = event.target.files[0];
            console.log('File selected:', file ? file.name : 'none', 'for Lab ID:', selectedLabId);
            
            if (!file) return;
            if (!selectedLabId) {
                Toast.error('Session error: No lab record selected');
                return;
            }

            const formData = new FormData();
            formData.append('lab_id', selectedLabId);
            formData.append('report_file', file);

            Toast.info('Uploading report and notifying patient...');

            try {
                const res = await fetch('../php/upload_lab_report.php', {
                    method: 'POST',
                    body: formData
                });
                
                const text = await res.text();
                console.log('Upload Response Text:', text);
                
                let response;
                try {
                    response = JSON.parse(text);
                } catch (e) {
                    console.error('JSON Parse Error:', e, 'Response text:', text);
                    throw new Error('Invalid server response');
                }

                if (response.status === 'success') {
                    Toast.success(response.message);
                    fetchLabResults();
                } else {
                    Toast.error(response.message || 'Upload failed');
                }
            } catch (err) {
                console.error('Upload Error:', err);
                Toast.error('Upload failed: ' + err.message);
            } finally {
                document.getElementById('labReportFileInput').value = '';
                selectedLabId = null;
            }
        }

        function openUploadModal() {
            document.getElementById('registrationPanel').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('regPatientId').focus();
        }

        // Modal functions for Account search
        function openSearchPatientModal() {
            document.getElementById('searchPatientModal').style.display = 'flex';
            document.getElementById('modalPatientSearch').focus();
        }

        function closeSearchPatientModal() {
            document.getElementById('searchPatientModal').style.display = 'none';
            document.getElementById('modalPatientSearch').value = '';
            document.getElementById('patientResultsList').innerHTML = '';
            document.getElementById('patientResultsList').style.display = 'none';
            document.getElementById('noResultsMessage').style.display = 'block';
        }

        function filterPatients() {
            const searchValue = document.getElementById('modalPatientSearch').value.toLowerCase().trim();
            const statusFilter = document.getElementById('patientStatusFilter').value;

            if (!searchValue && !statusFilter) {
                document.getElementById('patientResultsList').style.display = 'none';
                document.getElementById('noResultsMessage').style.display = 'block';
                return;
            }

            document.getElementById('searchLoadingState').style.display = 'block';

            setTimeout(() => {
                document.getElementById('searchLoadingState').style.display = 'none';

                const filtered = patientsDatabase.filter(patient => {
                    const matchesSearch = searchValue === '' ||
                        patient.id.toLowerCase().includes(searchValue) ||
                        patient.nic.toLowerCase().includes(searchValue) ||
                        patient.name.toLowerCase().includes(searchValue);
                    const matchesStatus = statusFilter === '' || patient.status === statusFilter;
                    return matchesSearch && matchesStatus;
                });

                const resultsList = document.getElementById('patientResultsList');
                if (filtered.length === 0) {
                    document.getElementById('noResultsMessage').style.display = 'block';
                    resultsList.style.display = 'none';
                    return;
                }

                document.getElementById('noResultsMessage').style.display = 'none';
                resultsList.style.display = 'block';
                resultsList.innerHTML = filtered.map(patient => `
          <div 
            onclick="openPatientProfile('${patient.id}')" 
            style="
              padding:15px;
              border:1px solid #e5e7eb;
              border-radius:8px;
              margin-bottom:10px;
              cursor:pointer;
              transition:all 0.2s;
              background:#f9fafb;
            "
            onmouseover="this.style.background='#f3f4f6';this.style.boxShadow='0 4px 6px rgba(0,0,0,.1)'"
            onmouseout="this.style.background='#f9fafb';this.style.boxShadow=''"
          >
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px">
              <div>
                <div style="font-weight:600;color:#1f2937;font-size:1rem">${patient.name}</div>
                <div style="color:#6b7280;font-size:0.9rem">ID: ${patient.id}</div>
              </div>
              <span class="badge" style="padding:4px 12px;border-radius:20px;font-size:0.85rem;background:${patient.status === 'active' ? '#d1fae5;color:#065f46' :
                        patient.status === 'pending' ? '#fef3c7;color:#92400e' :
                            '#e5e7eb;color:#374151'
                    }">
                ${patient.status.charAt(0).toUpperCase() + patient.status.slice(1)}
              </span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;font-size:0.9rem;color:#6b7280">
              <div>
                <div style="color:#4b5563;font-weight:500">NIC</div>
                <div>${patient.nic}</div>
              </div>
              <div>
                <div style="color:#4b5563;font-weight:500">Diagnosis</div>
                <div>${patient.diagnosis}</div>
              </div>
              <div>
                <div style="color:#4b5563;font-weight:500">Last Visit</div>
                <div>${patient.lastVisit}</div>
              </div>
            </div>
            <div style="margin-top:10px;text-align:right">
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openPatientProfile('${patient.id}')">View Profile →</button>
            </div>
          </div>
        `).join('');
            }, 300);
        }

        function openPatientProfile(patientId) {
            const patient = patientsDatabase.find(p => p.id === patientId);
            if (patient) {
                Toast.success(`Opening profile for ${patient.name}...`);
                closeSearchPatientModal();
            }
        }

        // Close modal when clicking overlay
        document.addEventListener('DOMContentLoaded', function () {
            const modal = document.getElementById('searchPatientModal');
            modal.addEventListener('click', function (e) {
                if (e.target === modal) {
                    closeSearchPatientModal();
                }
            });
        });
    </script>
</body>

</html>
