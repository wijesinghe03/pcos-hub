<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../../assets/js/theme-init.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Patients — PCOS Care Hub</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">

</head>

<body>
    <div id="page-loader" class="page-loader">
        <div class="loader-ring"></div>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>
    <div id="sidebar-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

    <div class="dashboard-layout">
        <!-- SIDEBAR -->
        <div id="sidebar-placeholder" data-active="search"></div>

        <!-- MAIN -->
        <main class="dash-main">
            <div class="dash-topbar">
                <div class="dash-page-title">
                    <h2>Search Patients</h2>
                    <p id="dateDisplay">Loading...</p>
                </div>
                <div class="topbar-actions">
                    <button class="topbar-icon-btn" title="Notifications">🔔<span class="notif-dot"></span></button>
                </div>
            </div>

            <!-- Search Panel -->
            <div class="dash-panel reveal">
                <div class="panel-header">
                    <div class="panel-title"><i>🔍</i> Find Patient</div>
                </div>
                <div style="margin-bottom:24px">
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px">
                        <div>
                            <label
                                style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Patient
                                ID or NIC</label>
                            <input type="text" id="searchPatientInput" class="form-control"
                                placeholder="e.g., P-0021 or 960341256V" onkeyup="performSearch()"
                                style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem">
                        </div>
                        <div>
                            <label
                                style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Patient
                                Name</label>
                            <input type="text" id="searchNameInput" class="form-control"
                                placeholder="e.g., Amanda Perera" onkeyup="performSearch()"
                                style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem">
                        </div>
                        <div>
                            <label
                                style="display:block;margin-bottom:8px;font-weight:500;color:#374151;font-size:0.95rem">Status</label>
                            <select id="searchStatusFilter" class="form-control" onchange="performSearch()"
                                style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem">
                                <option value="">All Patients</option>
                                <option value="active">Active</option>
                                <option value="pending">Pending Reports</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="performSearch()" style="width:100%">Search</button>
                </div>
            </div>

            <!-- Results Stats -->
            <div id="resultsStats" style="display:none;margin-bottom:20px">
                <div
                    style="padding:15px;background:#f0f9ff;border-left:4px solid #3b82f6;border-radius:8px;color:#1e40af">
                    <strong id="resultsCount"></strong> patient(s) found
                </div>
            </div>

            <!-- Search Results -->
            <div class="dash-panel reveal">
                <div class="panel-header">
                    <div class="panel-title"><i>👥</i> Search Results</div>
                </div>
                <div id="searchResultsContainer" style="max-height:600px;overflow-y:auto">
                    <div style="text-align:center;padding:40px 20px;color:#6b7280">
                        <div style="font-size:3rem;margin-bottom:10px">🔍</div>
                        <p style="font-size:1.1rem;margin:0">Enter search criteria to find patients</p>
                        <p style="font-size:0.9rem;margin:5px 0 0 0">Search by ID, NIC, or name</p>
                    </div>
                </div>
            </div>

            <!-- Recent Searches (Optional) -->
            <div class="dash-panel reveal" style="margin-top:20px">
                <div class="panel-header">
                    <div class="panel-title"><i>⏱️</i> Quick Actions</div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
                    <button class="btn btn-outline" onclick="setFilterAndSearch('active')"
                        style="padding:12px;cursor:pointer;border-radius:8px;"
                        
                        >
                        👥 View Active Patients
                    </button>
                    <button class="btn btn-outline" onclick="setFilterAndSearch('pending')"
                        style="padding:12px;cursor:pointer;border-radius:8px;"
                        
                        >
                        ⏳ Pending Reports
                    </button>
                    <button class="btn btn-outline" onclick="clearSearch()"
                        style="padding:12px;cursor:pointer;border-radius:8px;"
                        
                        >
                        🔄 Clear Search
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>


                <div style="margin-bottom:20px">
                    <input type="text" id="modalPatientSearch" class="form-control"
                        placeholder="Search by Patient ID or NIC…"
                        style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem"
                        onkeyup="filterPatients()">
                </div>

                <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
                    <select id="patientStatusFilter" class="form-control"
                        style="flex:1;min-width:150px;padding:8px;border:1px solid #d1d5db;border-radius:8px"
                        onchange="filterPatients()">
                        <option value="">All Patients</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending Reports</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>

                <div id="patientResultsContainer" style="max-height:400px;overflow-y:auto">
                    <div id="noResultsMessage" style="text-align:center;padding:30px;color:#6b7280">
                        <p style="margin:0">Start typing to search for patients...</p>
                    </div>
                    <div id="patientResultsList" style="display:none"></div>
                </div>

                <div id="searchLoadingState" style="display:none;text-align:center;padding:20px">
                    <div class="loader-ring" style="transform:scale(0.5);margin:0 auto"></div>
                    <p style="color:#6b7280;margin-top:10px">Searching patients...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
        async function performSearch() {
            const searchId = document.getElementById('searchPatientInput').value.toLowerCase().trim();
            const searchName = document.getElementById('searchNameInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('searchStatusFilter').value;

            const resultsContainer = document.getElementById('searchResultsContainer');
            const statsContainer = document.getElementById('resultsStats');



            resultsContainer.innerHTML = `
              <div style="text-align:center;padding:40px">
                <div class="loader-ring" style="margin:0 auto;transform:scale(0.7)"></div>
                <p style="margin-top:10px;color:#6b7280">Searching records...</p>
              </div>
            `;

            try {
                const res = await fetch(`../php/search_patients.php?id=${searchId}&name=${searchName}&status=${statusFilter}`);
                const response = await res.json();

                if (response.status === 'success') {
                    const filtered = response.data;

                    if (filtered.length === 0) {
                        resultsContainer.innerHTML = `
                          <div style="text-align:center;padding:40px 20px;color:#6b7280">
                            <div style="font-size:3rem;margin-bottom:10px">😔</div>
                            <p style="font-size:1.1rem;margin:0">No patients found</p>
                            <p style="font-size:0.9rem;margin:5px 0 0 0">Try different search criteria</p>
                          </div>
                        `;
                        statsContainer.style.display = 'none';
                        return;
                    }

                    statsContainer.style.display = 'block';
                    document.getElementById('resultsCount').textContent = filtered.length;

                    resultsContainer.innerHTML = filtered.map(patient => `
                <div 
                  style="
                    padding:16px;
                    border:1px solid #e5e7eb;
                    border-radius:8px;
                    margin-bottom:12px;
                    background:white;
                    transition:all 0.2s;
                    cursor:pointer;
                  "
                  onmouseover="this.style.background='#f9fafb';this.style.boxShadow='0 4px 6px rgba(0,0,0,.1)'"
                  onmouseout="this.style.background='white';this.style.boxShadow=''"
                  onclick="openPatientDetail('${patient.raw_id}')"
                >
                    <div style="background:var(--purple-primary);color:white;padding:4px 10px;border-radius:6px;font-size:0.8rem;font-weight:700;margin-bottom:8px;display:inline-block">PATIENT ID: ${patient.id}</div>
                    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
                      <div>
                        <div style="font-weight:700;color:#1f2937;font-size:1.1rem">${patient.name}</div>
                        <div style="color:#6b7280;font-size:0.9rem">NIC/Passport: ${patient.nic}</div>
                      </div>
                      <span style="padding:6px 14px;border-radius:20px;font-size:0.85rem;font-weight:600;background:${patient.status === 'active' ? '#d1fae5;color:#065f46' :
                              patient.status === 'pending' ? '#fef3c7;color:#92400e' :
                                  '#e5e7eb;color:#374151'
                          }">
                        ${patient.status.charAt(0).toUpperCase() + patient.status.slice(1)}
                      </span>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:0.9rem;margin:10px 0;padding:12px;background:#f9fafb;border-radius:8px">
                      <div>
                        <div style="color:#6b7280;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">Diagnosis</div>
                        <div style="font-weight:600;color:#1f2937">${patient.diagnosis}</div>
                      </div>
                      <div>
                        <div style="color:#6b7280;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">Last Visit</div>
                        <div style="font-weight:600;color:#1f2937">${patient.lastVisit}</div>
                      </div>
                      <div>
                        <div style="color:#6b7280;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">Reports</div>
                        <div style="font-weight:600;color:#1f2937">${patient.reports}</div>
                      </div>
                      <div>
                        <div style="color:#6b7280;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">Contact</div>
                        <div style="font-weight:600;color:#1f2937">${patient.phone}</div>
                      </div>
                    </div>
                    <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:10px">
                      <button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border:1px solid #fecaca" onclick="event.stopPropagation();confirmRemoval('${patient.raw_id}', '${patient.name}')">🗑️ Remove Patient</button>
                    </div>
                  </div>
              `).join('');
                } else {
                    Toast.error(response.message || 'Failed to fetch patients');
                }
            } catch (err) {
                console.error(err);
                Toast.error('An error occurred during search');
            }
        }

        function setFilterAndSearch(status) {
            document.getElementById('searchStatusFilter').value = status;
            performSearch();
        }

        function clearSearch() {
            document.getElementById('searchPatientInput').value = '';
            document.getElementById('searchNameInput').value = '';
            document.getElementById('searchStatusFilter').value = '';
            document.getElementById('searchResultsContainer').innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:#6b7280">
          <div style="font-size:3rem;margin-bottom:10px">🔍</div>
          <p style="font-size:1.1rem;margin:0">Enter search criteria to find patients</p>
          <p style="font-size:0.9rem;margin:5px 0 0 0">Search by ID, NIC, or name</p>
        </div>
      `;
            document.getElementById('resultsStats').style.display = 'none';
        }

        function openPatientDetail(patientId) {
            Toast.info(`Redirecting to patient profile (ID: ${patientId})...`);
            // window.location.href = `hospital-patient-profile.html?id=${patientId}`;
        }

        async function confirmRemoval(patientId, patientName) {
            if (confirm(`Are you sure you want to remove ${patientName} from this hospital's records? This will delete all associated appointments and reports for this patient at your hospital.`)) {
                try {
                    const formData = new FormData();
                    formData.append('patient_id', patientId);
                    
                    const res = await fetch('../php/remove_hospital_patient.php', {
                        method: 'POST',
                        body: formData
                    });
                    const response = await res.json();
                    
                    if (response.status === 'success') {
                        Toast.success(response.message);
                        performSearch(); // Refresh list
                    } else {
                        Toast.error(response.message);
                    }
                } catch (err) {
                    console.error(err);
                    Toast.error('Failed to remove patient');
                }
            }
        }


        // DOMContentLoaded logic
        document.addEventListener('DOMContentLoaded', function () {

            // Sync dates
            const dateDisplay = document.getElementById('dateDisplay');
            if (dateDisplay) {
                const now = new Date();
                dateDisplay.textContent = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            // Check for URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const queryId = urlParams.get('id');
            if (queryId) {
                document.getElementById('searchPatientInput').value = queryId;
            }

            // Perform initial search to show all current hospital patients
            performSearch();
        });
    </script>
</body>

</html>
