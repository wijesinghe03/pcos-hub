<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../../assets/js/theme-init.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PCOS Care Hub</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/navbar.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
</head>

<body>

  <div id="page-loader" class="page-loader">
    <div class="loader-ring"></div>
  </div>

  <div class="auth-page">
    <!-- LEFT PANEL -->
    <div class="auth-panel-left">
      <!-- Floating Shapes -->
      <div class="floating-shape shape-1"></div>
      <div class="floating-shape shape-2"></div>
      <div class="floating-shape shape-3"></div>

      <div class="auth-left-content">
        <a href="index.html" class="auth-left-logo">
          <div class="logo-icon">♥</div>
          <div class="logo-text"><span>PCOS</span> Care Hub</div>
        </a>
        <h2 data-i18n="reset_pw_hero_title">Create a New Password</h2>
        <p data-i18n="reset_pw_hero_desc">Your security is our priority. Please choose a strong password that you haven't used before.</p>
        
        <div class="auth-features">
          <div class="auth-feature">
            <div class="auth-feature-icon">🛡️</div>
            <div>
              <div class="auth-feature-text" data-i18n="reset_pw_feat_1">Password Strength</div>
              <div class="auth-feature-sub" data-i18n="reset_pw_feat_1_sub">Use a mix of letters, numbers, and symbols.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="auth-panel-right">
      <div class="auth-form-wrap">
        <div class="auth-header">
          <h3 data-i18n="reset_pw_form_title">Set New Password</h3>
          <p data-i18n="reset_pw_form_desc">Please enter your new password below.</p>
        </div>

        <form class="auth-form" id="resetPwForm" onsubmit="handleResetPw(event)">
          <input type="hidden" id="token">
          <input type="hidden" id="email">
          <input type="hidden" id="role">

          <!-- New Password -->
          <div class="form-group">
            <label class="form-label" for="new_password" data-i18n="new_password_label">New Password</label>
            <div class="input-icon-wrap">
              <span class="input-icon">🔒</span>
              <input class="form-control" type="password" id="new_password" placeholder="Enter new password" required minlength="8">
              <button type="button" class="toggle-pw" onclick="togglePassword('new_password', this)">👁</button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm_password" data-i18n="confirm_password_label">Confirm Password</label>
            <div class="input-icon-wrap">
              <span class="input-icon">🔒</span>
              <input class="form-control" type="password" id="confirm_password" placeholder="Confirm new password" required minlength="8">
              <button type="button" class="toggle-pw" onclick="togglePassword('confirm_password', this)">👁</button>
            </div>
          </div>

          <button type="submit" class="auth-submit" data-i18n="reset_pw_btn">Update Password</button>
        </form>

        <div class="auth-footer">
          <p><a href="login.html" data-i18n="back_to_login">← Back to Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script>
    // Initialize from URL params
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const email = params.get('email');
      const role = params.get('role');

      if (!token || !email || !role) {
        Toast.error('Invalid or missing reset token.');
        setTimeout(() => window.location.href = 'login.html', 3000);
        return;
      }

      document.getElementById('token').value = token;
      document.getElementById('email').value = email;
      document.getElementById('role').value = role;
    });

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
      else { input.type = 'password'; btn.textContent = '👁'; }
    }

    async function handleResetPw(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const token = document.getElementById('token').value;
      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;

      if (newPassword !== confirmPassword) {
        Toast.error('Passwords do not match.');
        return;
      }

      const submitBtn = e.target.querySelector('.auth-submit');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Updating...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('../php/reset_password_handler.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, email, role, new_password: newPassword })
        });

        const data = await response.json();

        if (data.status === 'success') {
          Toast.success(data.message);
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          Toast.error(data.message);
        }
      } catch (error) {
        Toast.error('An error occurred. Please try again later.');
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
