<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../../assets/js/theme-init.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging into Patient Portal — PCOS Care Hub</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
    <style>
        .loading-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #f0e6ff 0%, #fce4f0 40%, #e8f4ff 100%);
            padding: 20px;
            text-align: center;
        }

        .loading-card {
            background: white;
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.6s ease both;
        }

        .feature-icon {
            font-size: 3.5rem;
            margin-bottom: 24px;
            display: block;
            animation: pulse-icon 2s infinite;
        }

        @keyframes pulse-icon {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 10px rgba(155, 89, 208, 0.3));
            }

            100% {
                transform: scale(1);
            }
        }

        .loading-card h2 {
            color: var(--text-dark);
            margin-bottom: 16px;
            font-size: 1.8rem;
        }

        .loading-card p {
            color: var(--text-mid);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--purple-pale);
            color: var(--purple-primary);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--purple-primary);
            border-radius: 50%;
            animation: fade-dot 1s infinite alternate;
        }

        @keyframes fade-dot {
            from {
                opacity: 0.3;
            }

            to {
                opacity: 1;
            }
        }

        .radar-box {
            position: relative;
            width: 100%;
            height: 6px;
            background: var(--purple-ghost);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .radar-bar {
            height: 100%;
            width: 30%;
            background: linear-gradient(to right, transparent, var(--pink-accent), transparent);
            position: absolute;
            left: -30%;
            animation: radar-sweep 2s infinite linear;
        }

        @keyframes radar-sweep {
            to {
                left: 100%;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .btn-manual {
            display: inline-block;
            margin-top: 10px;
            color: var(--purple-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-manual:hover {
            text-decoration: underline;
        }

        .btn-primary {
            background: var(--purple-primary);
            border-color: var(--purple-primary);
            width: 100%;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="loading-container">
        <div class="loading-card">
            <span class="feature-icon" id="feature-icon">📊</span>
            <div class="status-badge">
                <div class="status-dot"></div>
                Auth Required
            </div>
            <h2 id="feature-title">Portal Access</h2>
            <p id="feature-msg">As a patient, you need to be logged in to track your <strong>symptom tracking, menstrual
                    cycle, secure health records, and lifestyle tracking</strong>. You will be redirected to the login
                page now.</p>
            <div class="radar-box">
                <div class="radar-bar"></div>
            </div>
            <a href="login.html" class="btn btn-primary">Sign In to Continue</a>
            <a href="login.html" class="btn-manual">Take me to Login immediately</a>
        </div>
    </div>
    <script>
        // Dynamically update icon based on source parameter
        const params = new URLSearchParams(window.location.search);
        const source = params.get('for');
        const iconEl = document.getElementById('feature-icon');
        const titleEl = document.getElementById('feature-title');

        const icons = {
            'symptoms': '📊',
            'cycle': '🩸',
            'records': '🔒',
            'lifestyle': '🥗'
        };

        const titles = {
            'symptoms': 'Symptom Tracking',
            'cycle': 'Menstrual Cycle Tracker',
            'records': 'Secure Health Records',
            'lifestyle': 'Lifestyle & Nutrition Log'
        };

        if (source && icons[source]) iconEl.innerText = icons[source];
        if (source && titles[source]) titleEl.innerText = titles[source];

        // Automatic redirect
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 2800);
    </script>
</body>

</html>
